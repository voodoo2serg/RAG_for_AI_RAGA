name: Community checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Unit tests
        working-directory: backend
        run: python -m pytest -q
      - name: Import API
        working-directory: backend
        run: python -c "from raga_community.api import app; print(app.title)"
      - name: Check excluded source paths
        run: |
          if git ls-files | grep -Ei 'rospatent|raga.?64|world[_-]?model|picture[_-]?world|signal' ; then
            echo 'An excluded source path has been detected.'
            exit 1
          fi

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start local edition
        run: docker compose up --build -d
      - name: Wait for API health
        run: |
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Exercise project import and source retrieval
        run: |
          python - <<'PY'
          import json, urllib.request
          BASE="http://127.0.0.1:8000"
          def post(path,payload):
              body=json.dumps(payload).encode()
              req=urllib.request.Request(BASE+path, data=body, headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          project=post("/api/projects",{"name":"CI verification"})
          pid=project["id"]
          session=post(f"/api/projects/{pid}/sessions",{
              "content":"Rule: keep context portable. Decision: use local storage."})
          assert session["session_id"]
          found=post(f"/api/projects/{pid}/retrieve",{"query":"portable context"})
          assert found["sources"],found
          print("Docker smoke test passed; citations:",len(found["sources"]))
          PY
      - name: Show diagnostics on failure
        if: failure()
        run: docker compose logs --tail 150
      - name: Stop
        if: always()
        run: docker compose down
